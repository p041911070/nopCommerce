# 物联网商城-h5
server {
 listen 80;
 server_name api.wuwukj.com;
 location / {
   proxy_pass http://192.168.0.8:9001;  #IIS中网站配置的IP和端口,需要要内网的ip
	#设置主机头和客户端真实地址，以便服务器获取客户端真实IP
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Server $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP  $remote_addr; 
	proxy_set_header X-Forwarded-Port 80;
	client_max_body_size 50m;
	
  }
}
server {
    listen 443 ssl;
    #配置HTTPS的默认访问端口为443。
    #如果未在此处配置HTTPS的默认访问端口，可能会造成Nginx无法启动。
    #如果您使用Nginx 1.15.0及以上版本，请使用listen 443 ssl代替listen 443和ssl on。
    server_name api.wuwukj.com; #需要将yourdomain.com替换成证书绑定的域名。
    ssl_certificate /etc/nginx/ssl/wuwukj.pem;  
    ssl_certificate_key /etc/nginx/ssl/wuwukj.key; 
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    #表示使用的加密套件的类型。
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2; #表示使用的TLS协议的类型。
    ssl_prefer_server_ciphers on;
	location / {  
		proxy_pass http://192.168.0.8:9001;  #IIS中网站配置的IP和端口,需要要内网的ip
		#设置主机头和客户端真实地址，以便服务器获取客户端真实IP
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Server $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP  $remote_addr; 
		proxy_set_header X-Forwarded-Port 443;
		client_max_body_size 50m; 
	}  
}
